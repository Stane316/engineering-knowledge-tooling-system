name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Qualité (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22.x, 24.x]

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier l'environnement
        run: npm run check:env

      - name: Lint
        run: npm run lint

      - name: Vérification des types
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Tests
        run: npm test

      - name: Couverture
        run: npm run coverage

      - name: Publier la couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-node-${{ matrix.node-version }}
          path: coverage/
          retention-days: 7

  dependencies:
    name: Vulnérabilités des dépendances de production
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      # Seules les dépendances de PRODUCTION bloquent la CI. La chaîne de
      # développement de Lighthouse traîne des avis (extract-zip, basic-ftp,
      # proxy-agent, @opentelemetry/*) qui n'ont pas de correctif compatible
      # avec le plancher Node du projet : ils sont triés dans
      # docs/INSPECTOR.md §11.1 et suivis par le risque R-8.10.
      - name: Audit des dépendances de production
        run: npm run audit:prod:ci

  benchmark:
    name: Benchmark recherche (100K documents)
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Compiler et mesurer (seuils C4.6, C4.7, C4.8)
        # Corpus réduit (20 000 documents, 5 000 vecteurs) pour rester sous
        # 2 minutes : le protocole est identique, seule l'échelle change.
        run: npm run test:benchmark -- --documents=20000 --vectors=5000 --queries=100 --assert

  secrets:
    name: Détection de secrets
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer l'historique complet
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Gitleaks 8.30.1
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scanner l'historique Git
        run: |
          set +e
          output=$(gitleaks git . --log-opts="--all" --config .gitleaks.toml \
            --report-format json --report-path .gitleaks-report.json \
            --redact --exit-code 7 2>&1)
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            echo "Aucun secret détecté dans l'historique."
            exit 0
          fi

          if [ -s .gitleaks-report.json ] && [ "$(jq 'length' .gitleaks-report.json)" -gt 0 ]; then
            count=$(jq 'length' .gitleaks-report.json)
            echo "::error::$count secret(s) potentiel(s) détecté(s) — valeur masquée, voir le fichier et la règle."
            jq -r '.[:20][] | "::error file=\(.File),line=\(.StartLine),title=\(.RuleID)::Secret potentiel détecté (valeur masquée par --redact)"' .gitleaks-report.json
          else
            echo "::error::Gitleaks a échoué sans rapport exploitable (erreur de configuration ou d'exécution)."
          fi

          echo "$output" | tail -15 | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::$line"
          done

          exit 1
